  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="500" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#0B5D4E" dominant-baseline="middle">Activity Diagram Transaksi Penjualan</text><circle cx="500" cy="78" r="19" fill="#0B5D4E"/><line x1="500" y1="97" x2="500" y2="120" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="121" width="340" height="54" rx="12" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="500" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#0F172A" dominant-baseline="middle"><tspan x="500" dy="0">Pilih menu Transaksi</tspan></text><line x1="500" y1="175" x2="500" y2="205" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="206" width="340" height="54" rx="12" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="500" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#0F172A" dominant-baseline="middle"><tspan x="500" dy="0">Pilih produk dan jumlah</tspan></text><line x1="500" y1="260" x2="500" y2="290" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="291" width="340" height="54" rx="12" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="500" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#0F172A" dominant-baseline="middle"><tspan x="500" dy="0">Tambahkan ke keranjang</tspan></text><line x1="500" y1="345" x2="500" y2="378" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/><polygon points="500,378 620,420 500,462 380,420" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="500" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#0F172A" dominant-baseline="middle"><tspan x="500" dy="0">Tambah barang lagi?</tspan></text><line x1="500" y1="462" x2="500" y2="495" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="496" width="340" height="54" rx="12" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="500" y="523" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#0F172A" dominant-baseline="middle"><tspan x="500" dy="0">Klik Simpan Transaksi</tspan></text><line x1="500" y1="550" x2="500" y2="582" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/><rect x="305" y="581" width="390" height="58" rx="12" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/><text x="500" y="600.5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#0F172A" dominant-baseline="middle"><tspan x="500" dy="0">API memvalidasi stok</tspan><tspan x="500" dy="19">dan menghitung total</tspan></text><line x1="500" y1="639" x2="500" y2="672" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/><polygon points="500,672 625,714 500,756 375,714" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="500" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#0F172A" dominant-baseline="middle"><tspan x="500" dy="0">Stok mencukupi?</tspan></text><line x1="500" y1="756" x2="500" y2="790" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="791" width="340" height="54" rx="12" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/><text x="500" y="818" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#0F172A" dominant-baseline="middle"><tspan x="500" dy="0">Simpan sales dan sale_items</tspan></text><line x1="500" y1="845" x2="500" y2="875" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="876" width="340" height="54" rx="12" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/><text x="500" y="903" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#0F172A" dominant-baseline="middle"><tspan x="500" dy="0">Kurangi stok dan catat movement out</tspan></text><line x1="500" y1="930" x2="500" y2="960" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="961" width="300" height="54" rx="12" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/><text x="500" y="988" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#0F172A" dominant-baseline="middle"><tspan x="500" dy="0">Commit transaksi</tspan></text><line x1="500" y1="1015" x2="500" y2="1045" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="1046" width="340" height="54" rx="12" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="500" y="1073" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#0F172A" dominant-baseline="middle"><tspan x="500" dy="0">Tampilkan sukses dan riwayat</tspan></text><line x1="500" y1="1100" x2="500" y2="1134" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/><circle cx="500" cy="1154" r="19" fill="#FFFFFF" stroke="#0B5D4E" stroke-width="4"/><circle cx="500" cy="1154" r="11" fill="#0B5D4E"/><path d="M 620 420 L 760 420 L 760 315 L 670 315" fill="none" stroke="#1D4ED8" stroke-width="1.7" marker-end="url(#arrow)"/><text x="690" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#475569" dominant-baseline="middle">Ya</text><text x="690" y="465" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#475569" dominant-baseline="middle">Tidak</text><line x1="625" y1="714" x2="750" y2="714" stroke="#B91C1C" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="670" y="683" width="240" height="62" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/><text x="790" y="704.5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#0F172A" dominant-baseline="middle"><tspan x="790" dy="0">Tampilkan error;</tspan><tspan x="790" dy="19">transaksi dibatalkan</tspan></text><path d="M 790 683 L 790 560 L 670 560" fill="none" stroke="#B91C1C" stroke-width="1.7" marker-end="url(#arrow)"/><text x="800" y="640" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#B91C1C" dominant-baseline="middle" font-style="italic">perbaiki jumlah</text><text x="500" y="1188" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#475569" dominant-baseline="middle" font-style="italic">Seluruh proses simpan berjalan dalam satu transaksi database (rollback jika gagal).</text>
</svg>