text><rect x="620" y="500" width="220" height="90" rx="14" fill="#F1F5F9" stroke="#475569" stroke-width="2"/><text x="730" y="533" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#0F172A" dominant-baseline="middle"><tspan x="730" dy="0">GitHub</tspan><tspan x="730" dy="24">Repository + branch</tspan></text><line x1="260" y1="310" x2="330" y2="310" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#475569" dominant-baseline="middle">HTTPS</text><line x1="550" y1="310" x2="620" y2="310" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/><text x="565" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#475569" dominant-baseline="middle">JSON + JWT</text><line x1="840" y1="300" x2="920" y2="190" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/><text x="860" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#475569" dominant-baseline="middle">SSL</text><line x1="840" y1="330" x2="920" y2="450" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow)"/><text x="860" y="405" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#475569" dominant-baseline="middle">HTTPS</text><path d="M 730 500 L 730 370" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="745" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#475569" dominant-baseline="middle" font-style="italic">deploy</text><path d="M 730 500 L 440 370" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="500" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#475569" dominant-baseline="middle" font-style="italic">deploy</text><text x="600" y="625" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#475569" dominant-baseline="middle">Semua komunikasi produksi menggunakan HTTPS. Database Aiven diakses dengan SSL.</text>
